phase: sketch

page:
  id: example-page
  min_width: 320
  max_width: 1440
  min_height: 320
  max_height: 1200
  orientations: [portrait, landscape]
  notes: 页面内容与状态保持不变，结构按断点重排。

regions:
  - id: header
    role: navigation
    parent_id: safe_area
    flutter_key: headerKey
    positioning: relative
    anchors:
      horizontal:
        start: {relation: aligned, reference: safe_area.start, token: page_margin}
        end: {relation: aligned, reference: safe_area.end, token: page_margin}
      vertical:
        top: {relation: inset, reference: safe_area.top, token: zero}
    size:
      min: {width: 0, height: 48}
      preferred: {width: content, height: 56}
      max: {width: content, height: 96}

  - id: content
    role: primary-content
    parent_id: safe_area
    flutter_key: contentKey
    positioning: relative
    anchors:
      horizontal:
        center: {relation: centered, reference: viewport.center}
        start: {relation: inset, reference: content_column.start, token: page_margin}
      vertical:
        top: {relation: after, reference: header.bottom, token: section_gap}
        bottom: {relation: before, reference: dock_avoidance.bottom, token: zero}
    size:
      min: {width: 0, height: 0}
      preferred: {width: content_max, height: content}
      max: {width: content_max, height: content}

  - id: content_column
    role: layout-container
    parent_id: safe_area
    flutter_key: contentColumnKey
    positioning: relative
    anchors:
      horizontal: {center: {relation: centered, reference: viewport.center}}
      vertical: {top: {relation: inset, reference: safe_area.top}}
    size:
      min: {width: 0, height: 0}
      preferred: {width: content_max, height: content}
      max: {width: content_max, height: content}
  - id: primary-action
    role: action
    parent_id: safe_area
    flutter_key: primaryActionKey
    positioning: relative
    anchors:
      horizontal: {center: {relation: centered, reference: safe_area.center}}
      vertical: {bottom: {relation: inset, reference: safe_area.bottom}}
    size:
      min: {width: 48, height: 48}
      preferred: {width: content, height: 48}
      max: {width: content, height: 96}
  - id: dock_avoidance
    role: layout-boundary
    parent_id: safe_area
    flutter_key: dockAvoidanceKey
    positioning: relative
    anchors:
      horizontal: {center: {relation: centered, reference: safe_area.center}}
      vertical: {bottom: {relation: before, reference: primary-action.top}}
    size:
      min: {width: 0, height: 0}
      preferred: {width: content, height: content}
      max: {width: content, height: content}

  # 需要弹窗时，将下例作为实际 region，并在 overlays 里以相同 id/body_kind 配对。
  # - id: dialog
  #   role: popup
  #   parent_id: safe_area
  #   flutter_key: dialogKey
  #   positioning: absolute
  #   floating_root_kind: popup
  #   size: {min: {width: 100, height: 80}, preferred: {width: 320, height: 240}, max: {width: 640, height: 480}}
  # - id: dialog-action
  #   role: action
  #   parent_id: dialog
  #   flutter_key: dialogActionKey
  #   positioning: relative
  #   anchors:
  #     horizontal: {center: {relation: centered, reference: dialog.center}}
  #     vertical: {top: {relation: inset, reference: dialog.top}}
  #   size: {min: {width: 48, height: 48}, preferred: {width: 80, height: 48}, max: {width: 160, height: 64}}
  # overlay 还需填写 behavior、occlusion、hit_target 和键盘/窄高度回退；内部节点不声明 floating_root_kind。

breakpoints:
  - id: compact-to-medium
    axis: width
    value: 600
    reason: 两列所需的最小内容宽度首次可满足
    change: 单列切换为两列，导航保持语义状态
    preserves: [route, selection, content-order]
    fallback: 不满足列最小宽度时回退到单列并允许纵向滚动
  - id: medium-to-expanded
    axis: width
    value: 840
    reason: 主从区域和常驻导航可同时满足最小宽度
    change: 内容最大宽度扩大并显示主从结构
    preserves: [route, selection, content-order]
    fallback: 主从区域堆叠，操作保留在文档流

content:
  max_width: 1120
  columns:
    min: 1
    preferred: 2
    max: 3
    min_item_width: 280
  gutter: {min: 12, preferred: 24, max: 32}
  margins: {min: 16, preferred: 24, max: 32}
  insufficient_width_fallback: 回退列数而不是压缩关键内容。

system_avoidance:
  safe_area: {source: MediaQuery.padding, consumer: page-shell, double_apply: forbidden}
  system_bars: {edge_to_edge: true, status_bar: explicit, navigation_bar: explicit}
  keyboard: {source: MediaQuery.viewInsets, mode: resize-and-scroll-focus, dock_fallback: inline}
  fold: {source: MediaQuery.displayFeatures, hinge_policy: avoid-interactive-content}
  split: {source: current-layout-constraints, recompute_on_resize: true}

scroll:
  vertical: {owner: page-scroll, semantics: primary-document, narrow_height_fallback: keep-one-owner-and-scroll}
  horizontal: {owner: none, semantics: no-horizontal-scroll, narrow_height_fallback: wrap-or-reflow}

text_behavior:
  localization: [default, longest_copy]
  rtl: logical-start-end
  text_scale: {default: 1.0, large: 1.5}
  line_break:
    width_constraint: bounded-by-parent
    body: {strategy: natural-soft-wrap}
    heading: {strategy: phrase-aware, orphan_control: prevent}
    critical_copy: {strategy: phrase-aware, orphan_control: prevent}
    control_label: {breaking: forbidden, fallback: expand-parent-or-reflow}
    atomic_text: {breaking: forbidden}
    dynamic_container: {fixed_height: forbidden, truncation: forbidden}
    anti_hacks: {manual_line_breaks: forbidden, fitted_box: forbidden, font_shrink: forbidden}
    fallback_order: [widen-container, reflow-parent, grow-height, semantic-wrap]
    test_ids: [text_wrap_semantics]
  growth: container-grows-with-content
  critical_actions_allow_truncation: false

overlays:
  - id: primary-action
    behavior: docked
    anchor: {reference: safe_area.bottom, relation: inset, token: page_margin}
    occlusion: content reserves docked height plus bottom inset
    hit_target: {min_width: 48, min_height: 48}
    keyboard_fallback: move-inline-or-scroll-focus
    narrow_height_fallback: move-inline

implementation:
  breakpoint_resolver: shared-page-breakpoint-resolver
  root_layout: Scaffold -> SafeArea -> constrained-shell -> single-scroll-owner
  constraint_primitives: [LayoutBuilder, MediaQuery, ConstrainedBox, Center, Flexible, Wrap, Sliver]

invariants:
  - id: content-stays-anchored
    relation: 内容区域始终位于 header 之后并受 content_max 约束
    test_ids: [content_header_relation, content_max_width]
  - id: primary-action-reachable
    relation: 关键动作在所有矩阵场景可见、可达且不被键盘或停靠层遮挡
    test_ids: [primary_action_reachable]
  - id: text-wrap-is-semantic
    relation: 文本在父级有限宽度内按语言规则换行，不含为视觉塑形插入的手工换行，且不可拆分词元保持完整
    test_ids: [text_wrap_semantics]

implementation_signals: []

evidence_matrix:
  cases:
    - id: compact-to-medium-minus
      width: 599
      height: 844
      orientation: portrait
      text_scale: 1.0
      locale: default
      safe_area: zero
      action_state: default
      breakpoint_edge: {id: compact-to-medium, offset: -1}
      test_ids: [content_header_relation, content_max_width, primary_action_reachable]
    - id: compact-to-medium-at
      width: 600
      height: 844
      orientation: portrait
      text_scale: 1.0
      locale: default
      safe_area: zero
      action_state: disabled
      breakpoint_edge: {id: compact-to-medium, offset: 0}
      test_ids: [content_header_relation, primary_action_reachable]
    - id: compact-to-medium-plus
      width: 601
      height: 844
      orientation: landscape
      text_scale: 1.5
      locale: longest_copy
      safe_area: nonzero
      action_state: submitting
      breakpoint_edge: {id: compact-to-medium, offset: 1}
      test_ids: [content_header_relation, primary_action_reachable, text_wrap_semantics]
    - id: medium-to-expanded-minus
      width: 839
      height: 500
      orientation: landscape
      text_scale: 1.0
      locale: default
      safe_area: zero
      action_state: default
      breakpoint_edge: {id: medium-to-expanded, offset: -1}
      same_width_group: narrow-height
      test_ids: [content_header_relation, primary_action_reachable]
    - id: medium-to-expanded-at
      width: 840
      height: 800
      orientation: portrait
      text_scale: 1.0
      locale: longest_copy
      safe_area: nonzero
      action_state: disabled
      breakpoint_edge: {id: medium-to-expanded, offset: 0}
      same_width_group: expanded-height
      test_ids: [content_header_relation, primary_action_reachable]
    - id: medium-to-expanded-plus
      width: 841
      height: 900
      orientation: landscape
      text_scale: 1.5
      locale: default
      safe_area: nonzero
      action_state: submitting
      breakpoint_edge: {id: medium-to-expanded, offset: 1}
      test_ids: [content_header_relation, primary_action_reachable]
    - id: narrow-height-companion
      width: 839
      height: 700
      orientation: landscape
      text_scale: 1.0
      locale: default
      safe_area: zero
      action_state: default
      same_width_group: narrow-height
      test_ids: [content_header_relation, primary_action_reachable]
