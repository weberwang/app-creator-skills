<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <meta name="description" content="跟着一只骑单车的小橘猫，去收集阳光和好心情。可暂停、变速的原创 SVG 动画。">
  <title>小猫出逃计划 · 骑向好天气</title>
  <style>
    :root { color-scheme: light; --paper:#f7f5ed; --ink:#294b43; --muted:#78877a; --orange:#cc744b; --duration:1.4s; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible { outline:3px solid var(--orange); outline-offset:5px; }
    .page { max-width:1380px; margin:auto; padding:30px 5.5vw 23px; }
    header,.brand,.chapter,.weather,.controls,.play,footer { display:flex; align-items:center; }
    header { justify-content:space-between; }
    .brand { gap:10px; font-size:14px; font-weight:700; letter-spacing:.12em; }
    .brand svg { width:35px; height:35px; }
    .edition { color:#929a87; font:10px Georgia,serif; letter-spacing:.18em; }
    .intro { padding:46px 0 34px; text-align:center; }
    .eyebrow { margin:0; color:#99917b; font-size:10px; letter-spacing:.28em; }
    h1 { margin:15px 0 17px; font-size:clamp(32px,4.2vw,56px); font-weight:500; letter-spacing:.065em; line-height:1.3; }
    h1 span { color:var(--orange); }
    .subtitle { margin:0; color:var(--muted); font-size:13px; letter-spacing:.08em; line-height:1.9; }
    .scene { position:relative; isolation:isolate; overflow:hidden; border:1px solid #d2dfcf; border-radius:22px; background:#deebe0; }
    .scene>svg { width:100%; display:block; aspect-ratio:2.2; }
    .scene-top { position:absolute; z-index:1; top:24px; left:28px; right:28px; display:flex; justify-content:space-between; pointer-events:none; }
    .chapter { gap:9px; color:#648174; font-size:11px; letter-spacing:.12em; }
    .chapter b { display:grid; place-items:center; width:24px; height:24px; border:1px solid #a2b9a2; border-radius:50%; font:11px Georgia,serif; }
    .weather { gap:8px; color:#648174; font-size:11px; letter-spacing:.1em; }
    .weather svg { width:19px; height:19px; }
    .scene-caption { position:absolute; bottom:19px; left:28px; margin:0; color:#718269; font-size:10px; letter-spacing:.15em; }
    .sound-note { position:absolute; left:61%; top:26%; opacity:0; color:#9c663b; font-size:22px; pointer-events:none; }
    .sound-note.ringing { animation:ring-note .9s ease-out; }
    .controls { gap:24px; justify-content:center; margin:24px 0 33px; }
    .play { justify-content:center; gap:10px; min-width:133px; border:0; border-radius:30px; background:var(--ink); color:#fffdf5; padding:12px 20px; font-size:12px; transition:background .2s; }
    .play:hover { background:#426958; }
    .play svg { width:12px; height:12px; }
    .small-control { display:flex; align-items:center; gap:7px; padding:10px 0; border:0; background:none; color:#68806e; font-size:12px; }
    .small-control:hover { color:#a35b3c; }
    .small-control svg { width:16px; height:16px; }
    .separator { height:16px; width:1px; background:#d7dccf; }
    .afterword { text-align:center; }
    .afterword p { margin:0; font:italic 18px Georgia,"Microsoft YaHei",serif; letter-spacing:.08em; color:#6f826b; }
    .afterword span { display:block; margin-top:11px; font-size:10px; letter-spacing:.12em; color:#a0a38f; }
    footer { justify-content:space-between; border-top:1px solid #e2e3d7; margin-top:37px; padding-top:18px; color:#929c88; font-size:10px; letter-spacing:.1em; }
    .footer-note { display:flex; align-items:center; gap:7px; }
    .dot { width:5px; height:5px; border-radius:50%; background:#a4b28c; }
    /* 同一根时钟驱动车轮、脚踏和背景，暂停与变速时保持动作同步。 */
    .cloud-near { animation:cloud-drift 36s linear infinite; }
    .cloud-far { animation:cloud-drift 64s linear infinite; }
    .scarf-tip { transform-origin:551px 216px; animation:scarf-wave calc(var(--duration) * .7) ease-in-out infinite alternate; }
    .tail { transform-origin:514px 274px; animation:tail-wave calc(var(--duration) * 1.7) ease-in-out infinite alternate; }
    .blink { transform-origin:608px 169px; animation:blink 5.6s infinite; }
    .is-paused .animated { animation-play-state:paused; }
    @keyframes cloud-drift { from { transform:translateX(70px); } to { transform:translateX(-110px); } }
    @keyframes scarf-wave { to { transform:rotate(8deg); } }
    @keyframes tail-wave { to { transform:rotate(-9deg); } }
    @keyframes blink { 0%,43%,47%,100% { transform:scaleY(1); } 45% { transform:scaleY(.08); } }
    @keyframes ring-note { 0% { opacity:0; transform:translateY(5px) rotate(-9deg); } 20% { opacity:1; } 100% { opacity:0; transform:translateY(-45px) rotate(12deg); } }
    @media (min-width:1500px) { .page { padding-top:38px; } .intro { padding-top:58px; } }
    @media (max-width:680px) {
      .page { padding:22px 18px; } .edition { font-size:8px; letter-spacing:.08em; } .brand { font-size:12px; }
      .intro { padding:39px 0 27px; } h1 { font-size:32px; } .subtitle { font-size:11px; }
      .scene { border-radius:17px; } .scene>svg { aspect-ratio:1.12; object-fit:cover; }
      .scene-top { top:17px; left:16px; right:16px; } .chapter { font-size:9px; gap:6px; } .weather { font-size:9px; }
      .scene-caption { left:17px; bottom:15px; font-size:8px; letter-spacing:.08em; }
      .controls { gap:16px; margin:20px 0 30px; } .play { min-width:117px; padding:12px 15px; }
      .small-control { font-size:11px; } .afterword p { font-size:15px; } footer { gap:20px; margin-top:30px; font-size:9px; }
      .sound-note { left:65%; top:33%; }
    }
    @media (prefers-reduced-motion:reduce) { .animated { animation:none; } }
  </style>
</head>
<body>

  <script>
    // 场景状态仅保存当前播放进度；恢复时重新计算时间差，避免后台切换造成跳帧。
    const scene = document.querySelector('.scene');
    const play = document.querySelector('#play');
    const speedButton = document.querySelector('#speed');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const speeds = [1, 1.5, 0.75];
    const speedLabels = ['1× 慢慢骑', '1.5× 追追风', '0.75× 晃悠悠'];
    let playing = !motionPreference.matches;
    let speedIndex = 0;
    let elapsed = 0;
    let lastTime = null;
    let audioContext;
    let noteTimer;
    const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'crank', 'near-leg', 'far-leg', 'near-paw', 'far-paw', 'road-texture'].map(id => [id, document.getElementById(id)]));

    /** 同步播放按钮的文字、图标和辅助技术状态。 */
    function updatePlayback() {
      scene.classList.toggle('is-paused', !playing);
      play.setAttribute('aria-pressed', String(playing));
      document.querySelector('#play-label').textContent = playing ? '停下来歇歇' : '出发，继续骑';
      document.querySelector('#play-icon').setAttribute('d', playing ? 'M2 1h3v12H2zM8 1h3v12H8z' : 'M2 1 12 7 2 13Z');
    }

    /** 两段式逆运动学让脚掌始终跟随踏板，同时保持腿长固定。 */
    function updateLeg(name, angle, bend) {
      const hipX = 540, hipY = 285, upper = 77, lower = 72;
      const x = 559 + Math.cos(angle) * 25, y = 397 + Math.sin(angle) * 25;
      const dx = x - hipX, dy = y - hipY, distance = Math.hypot(dx, dy);
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + along * dx / distance + bend * offset * dy / distance;
      const kneeY = hipY + along * dy / distance - bend * offset * dx / distance;
      parts[name + '-leg'].setAttribute('d', `M${hipX} ${hipY} ${kneeX} ${kneeY} ${x} ${y}`);
      parts[name + '-paw'].setAttribute('cx', x);
      parts[name + '-paw'].setAttribute('cy', y);
    }

    /** 使用统一进度驱动关节和场景位移，在隐藏标签页中停止累计时间。 */
    function animate(time) {
      if (lastTime !== null && playing && !document.hidden) elapsed += Math.min(time - lastTime, 60) * speeds[speedIndex];
      lastTime = time;
      const angle = elapsed / 1400 * Math.PI * 2;
      const degrees = angle * 180 / Math.PI;
      parts['rear-wheel'].setAttribute('transform', `rotate(${degrees})`);
      parts['front-wheel'].setAttribute('transform', `rotate(${degrees})`);
      parts.crank.setAttribute('transform', `translate(559 397) rotate(${degrees})`);
      parts['road-texture'].setAttribute('transform', `translate(${-elapsed / 1400 * 190 % 190} 0)`);
      updateLeg('near', angle, 1);
      updateLeg('far', angle + Math.PI, -1);
      requestAnimationFrame(animate);
    }

    /** 切换骑行状态，不重置当前踩踏位置。 */
    function togglePlayback() { playing = !playing; updatePlayback(); }

    /** 在预设速度间循环，同时更新装饰动画和可读标签。 */
    function changeSpeed() {
      speedIndex = (speedIndex + 1) % speeds.length;
      document.documentElement.style.setProperty('--duration', `${1.4 / speeds[speedIndex]}s`);
      document.querySelector('#speed-label').textContent = speedLabels[speedIndex];
      speedButton.setAttribute('aria-label', `切换骑行速度，当前为 ${speeds[speedIndex]} 倍`);
    }

    /** 车铃由浏览器即时合成；无音频支持时仍显示提示，不阻断页面。 */
    function ringBell() {
      const note = document.querySelector('.sound-note');
      note.classList.remove('ringing');
      void note.offsetWidth;
      note.classList.add('ringing');
      clearTimeout(noteTimer);
      document.querySelector('#status').textContent = '叮铃～小猫向你打招呼！';
      noteTimer = setTimeout(clearBell, 1000);
      try {
        audioContext ??= new AudioContext();
        void audioContext.resume().catch(ignoreAudioError);
        for (const delay of [0, .14]) {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const start = audioContext.currentTime + delay;
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(delay ? 1760 : 2093, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(.1, start + .005);
          gain.gain.exponentialRampToValueAtTime(.001, start + .7);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(start);
          oscillator.stop(start + .75);
        }
      } catch { /* 音频设备不可用时保留文字反馈。 */ }
    }

    /** 忽略浏览器音频策略导致的失败，页面仍可正常交互。 */
    function ignoreAudioError() {}
    /** 清除播报内容，让连续点击车铃也能重新触发播报。 */
    function clearBell() { document.querySelector('#status').textContent = ''; }
    /** 用户开启减少动态效果后暂停骑行，仍允许主动点击恢复。 */
    function onMotionChange(event) { if (event.matches) { playing = false; updatePlayback(); } }
    /** 标签页可见性变化时重置上一帧时间，避免累积后台停留时长。 */
    function onVisibilityChange() { lastTime = null; }

    play.addEventListener('click', togglePlayback);
    speedButton.addEventListener('click', changeSpeed);
    document.querySelector('#bell').addEventListener('click', ringBell);
    motionPreference.addEventListener('change', onMotionChange);
    document.addEventListener('visibilitychange', onVisibilityChange);
    updatePlayback();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
